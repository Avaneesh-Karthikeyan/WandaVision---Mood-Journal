name: CI/CD — Test & Deploy to Render

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ────────────────────────────────────────────
  # Job 1: Run tests
  # ────────────────────────────────────────────
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test .env file
        run: |
          echo "GROQ_API_KEY=test-key-for-ci" >> .env
          echo "DATABASE_URL=sqlite:///./test_journal.db" >> .env

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # ────────────────────────────────────────────
  # Job 2: Deploy to Render (only on main after tests pass)
  # Render auto-deploys on push, but this job lets you
  # trigger a deploy only after tests pass using the
  # Render Deploy Hook URL stored as a GitHub secret.
  # ────────────────────────────────────────────
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for deployment to start
        run: sleep 15

      - name: Verify deployment health
        run: |
          curl --fail --retry 10 --retry-delay 10 \
            https://${{ secrets.RENDER_APP_NAME }}.onrender.com/health
